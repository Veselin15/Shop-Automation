# ============================================================
#  DOM селектори.
#
#  Това е единственият файл, който ще пипаш, когато някой от двата
#  сайта смени дизайна си. Всяко поле е СПИСЪК от кандидати — ботът
#  пробва отгоре надолу и взима първия, който съществува.
#
#  `shopbot calibrate bazar --url https://bazar.bg/ads/save`
#  `shopbot calibrate bestsecret --url <адрес на продукт>`
#  изкарват реалната структура на страницата, за да ги обновиш.
# ============================================================

bestsecret:
  # Проверено на живо в логнат профил. Сайтът е server-rendered, без JSON-LD
  # и без data-testid по продуктите — класовете по-долу са реалните.

  # Най-сигурният признак за излязла сесия: препращане към "желязната врата".
  # URL проверка не зависи от CSS класове и не остарява.
  auth_wall_url_pattern: "acquisition/entrance"
  auth_wall_markers:
    - "#login-button"
    - "form[action*='acquisition/entrance']"
  logged_in_markers:
    - "a[href*='account_menu.htm']"
    - "a[href*='personal_wish_list.htm']"
    - "a[href*='cart.htm']"

  # ---------------- листинг на категория ----------------
  # Плочката носи марка, име, RRP, намаление и цена, така че се филтрира
  # още тук и се отварят само продуктите, които имат шанс.
  product_card:
    - ".plp__product-list__product-container"
  card_link:
    - "a[href*='product.htm']"
  card_brand:
    - ".designer"
  card_name:
    - ".name"
  # ВАЖНО: сайтът показва едновременно EUR и BGN. `.main-prices` е блокът
  # в основната валута; `.secondary-prices` трябва да се пренебрегва.
  card_rrp:
    - ".main-prices .rrp"
  card_price:
    - ".main-prices .sold-price"
  card_discount:
    - ".discount-tag"
  card_badge:
    - ".product-tag-list"
  card_image:
    - "img.image-switcher--main-image"
    - "img"

  # ---------------- продуктова страница ----------------
  # Всичко се търси В ТОЗИ корен. Извън него страницата съдържа мини-кошница
  # със свои .rrp / .sold-price / .discount-tag, които подават грешни числа.
  pdp_root:
    - "article.product .product-details"
    - ".product-details"
  pdp_brand:
    - ".designer-name"
  pdp_title:
    - ".product-title"
  pdp_price:
    - ".main-prices .sold-price"
  pdp_orig_price:
    - ".main-prices .rrp"
  pdp_discount:
    - ".main-prices .discount-tag"
  # Истинските характеристики (механизъм, материя, размери) са в
  # .details-section; ".description" не хваща нищо на текущия сайт.
  pdp_description:
    - ".details-section"
    - ".accordion__content"
    - ".description"
  pdp_images:
    - ".image-gallery img"
    - ".gallery-image"
  pdp_sizes:
    - ".size-selector button"
    - ".size-selector li"
    - ".size-selector option"
  pdp_size_disabled_attr: "disabled"
  pdp_sold_out_markers:
    - "text=Sold out"
    - "text=Ausverkauft"
  pdp_low_stock_markers:
    - 'text=/Only \d+ left/i'
    - 'text=/Last \d+ item/i'

bazar:
  # Проверено на живо в логнат профил на /ads/save.
  login_url: https://bazar.bg/user/login
  publish_url: https://bazar.bg/ads/save
  my_ads_url: https://bazar.bg/ads/my
  delete_url_template: https://bazar.bg/ads/delete/{id}

  # Входът НЕ е обикновен form POST. Кликът пуска JS верига, която накрая
  # вика този API. Само неговият отговор казва дали входът е минал.
  login_api_pattern: "authentication/login"
  login_form: "#login-form"
  login_email: "#login-form input[name='email']"
  login_password: "#login-form input[name='password']"
  login_submit: "#login-form input[type='submit']"
  # ВНИМАНИЕ: contact_website е honeypot и на двете форми — родителят му е
  # position:absolute; left:-9999px. Трябва да остане ПРАЗЕН.
  honeypot_field: "input[name='contact_website']"
  logged_in_markers:
    - "a[href*='/user/logout']"
    - "#submitBtn"

  # Bazar.bg ползва CookieScript. Бутоните са DIV-ове, не <button>, затова
  # текстови селектори по button никога не съвпадат. Банерът се инжектира
  # след зареждане и прихваща кликовете, докато не бъде затворен.
  cookie_container: "#cookiescript_injected_wrapper"
  cookie_reject:
    - "#cookiescript_reject"
  # Резервно затваряне без приемане. "Приемете всички" не се ползва изобщо.
  cookie_dismiss:
    - "#cookiescript_close"

  # ---------------- формата за нова обява ----------------
  form: "#saveAdForm"
  form_title:
    - "#title"
  # Описанието е Redactor: видимото поле е contenteditable body в iframe,
  # а textarea#descr стои скрит и се пълни от редактора при изпращане.
  form_description_frame: "#redactorIframe"
  form_description_body: "body"
  form_description_textarea: "#descr"
  # Категорията се задава като число в скритото поле; видимият <select>
  # се пълни от JS и остава празен, докато не се мине през джаджата.
  form_category_id: "#category_id"
  form_category_select: "#rubChooser"
  # Радиото за "фиксирана цена" (другите две са "По договаряне" и "Подарявам").
  form_price_fixed_radio: "#rprice2"
  form_price:
    - "#saveAdForm input[name='price']"
  form_location_city:
    - "#province_city_location"
  form_location_district:
    - "#populated_location"
  form_phone:
    - "#tel"
  form_images_input:
    - "#saveAdForm input[type='file']"
  form_submit:
    - "#submitBtn"
  form_error:
    - ".alert-error:visible"
    - "#error_title"
    - ".alert-danger"

  # Изисквания на сайта, проверени от съобщенията във формата.
  min_title_len: 15
  min_description_len: 40
  min_image_edge: 250

  # Резултат след публикуване
  published_url_pattern: 'bazar\.bg/obiava-(\d+)'

  # Моите обяви
  my_ad_row:
    - "[data-ad-id]"
    - ".ad-row"
  my_ad_id_attr: "data-ad-id"
  # Потвърждението не е бутон, а връзка: <a class="editbtn"
  # href="/ads/delete/<id>?sure=yes">ИЗТРИВАНЕ</a>. Затова "button:has-text
  # ('Изтрий')" не улучваше нищо и обявите оставаха живи след „изтриване".
  delete_confirm:
    - "a[href*='sure=yes']"
    - "a.editbtn:has-text('ИЗТРИВАНЕ')"
    - "button:has-text('Изтрий')"
    - "button:has-text('Потвърди')"
    - "input[type='submit'][value*='Изтрий']"
