# ------------------------------------------------------------
#  ОЦЕНКА ОТ МОДЕЛ
#  Гледа снимката и името и казва колко е вероятно артикулът да се купи
#  в България на нашата цена. Отсява странните форми, които са намалени
#  с 80% именно защото никой не ги е поискал.
#  Безплатно по подразбиране: GEMINI_API_KEY от aistudio.google.com.
# ------------------------------------------------------------
appraisal:
  enabled: true
  # gemini    — безплатният таван на Google AI Studio. Ключът се взима без
  #             карта от aistudio.google.com и се слага в .env като
  #             GEMINI_API_KEY. Безплатният план има дневен таван на заявките.
  # ollama    — модел на самия сървър. Нула стотинки и нула сметки, но иска
  #             инсталиран ollama и изтеглен визуален модел, а на процесор
  #             една оценка отнема десетки секунди.
  # anthropic — платено, за когато качеството на оценката си струва.
  provider: gemini
  model: gemini-3.5-flash-lite
  # Само при provider: ollama.
  ollama_url: http://127.0.0.1:11434
  # Общ праг 0..1.
  min_score: 0.55
  # По категории: часовникът с добра марка се продава и когато е скучен,
  # а очилата се търсят само ако формата е носима.
  min_score_by_category:
    watches_men: 0.45
    watches_women: 0.45
    sunglasses_men: 0.70
    sunglasses_women: 0.70
    # При чанти и портфейли снимката продава, не марката: купувачът гледа
    # как изглежда и колко струва. Затова прагът е като при часовниците —
    # отсява екстравагантното (0.05-0.35), но пуска „класическо, но с
    # непозната марка", което се продава по-бавно, но се продава.
    bags_women: 0.45
    bags_men: 0.45
    small_accessories_women: 0.45
    small_accessories_men: 0.45
  # Таван на заявките за цикъл — пази безплатния дневен лимит. Оценката се
  # пази в базата и не се повтаря за същия продукт.
  max_calls_per_run: 120
  # Всяка снимка е заявка към лимита и секунди чакане. Две стигат.
  max_images: 2
  timeout_s: 40
  # Когато моделът не отговори: skip оставя артикула за следващия цикъл,
  # accept го пуска с досегашните правила.
  on_error: skip

pricing:
  # От 01.01.2026 България е в еврозоната. Ако при теб Bazar.bg още
  # работи в лева, смени на BGN — всички сметки се преизчисляват.
  output_currency: EUR
  fx:
    eur_bgn: 1.95583
  default_markup: 1.30
  markup_by_category:
    # Само две изключения от общата надценка:
    # чантите, където абсолютната сума боде (45% върху 120 € са 54 € отгоре,
    # и купувачът се сеща за магазина);
    bags_women: 1.25
    bags_men: 1.25
    # и дребните артикули, където процентът е малко пари (45% върху 40 € са
    # 18 € и никой не ги усеща).
    small_accessories_women: 1.45
    small_accessories_men: 1.45
  # Доставка BestSecret -> теб, влиза в себестойността преди надценката.
  shipping_buffer: 4.50
  # Заявка + 10 дни чакане + разходка до куриера. Под това не си струва.
  min_absolute_margin: 12.0
  charm_ending: 0.90
  min_listing_price: 45.0
  max_listing_price: 400.0

listing:
  location: "София"
  condition: "Ново"
  max_images: 6

  # Път в дървото на Bazar.bg, ниво по ниво. Пътят, а не само последният
  # етикет, защото "Мъжки" се среща и под Часовници, и под Дрехи, и под Обувки.
  # Числови id-та на рубриките в Bazar.bg, взети от window.categoriesTree
  # на самата форма. Числото е това, което формата праща — по-надеждно е от
  # кликане по имена, а и AI подсказката на сайта връща същите числа.
  category_map:
    sunglasses_women:        339    # Мода > Аксесоари > Слънчеви и диоптрични очила
    sunglasses_men:          339
    watches_women:           335    # Мода > Часовници > Дамски
    watches_men:             336    # Мода > Часовници > Мъжки
    bags_women:              338    # Мода > Аксесоари > Чанти
    bags_men:                338
    small_accessories_women: 457    # Мода > Аксесоари > Портфейли, портмонета
    small_accessories_men:   457
    hats_women:              340    # Мода > Аксесоари > Шапки
    hats_men:                340
    scarves_women:           1103   # Мода > Аксесоари > Шалове
    scarves_men:             1103

  # Български дума пред заглавието. Bazar.bg се търси на кирилица, а имената
  # от BestSecret са на английски — без това обявата не се намира.
  title_prefix:
    sunglasses_women: "Слънчеви очила"
    sunglasses_men: "Слънчеви очила"
    watches_women: "Дамски часовник"
    watches_men: "Мъжки часовник"
    bags_women: "Дамска чанта"
    bags_men: "Мъжка чанта"
    small_accessories_women: "Портфейл"
    small_accessories_men: "Портфейл"
    hats_women: "Шапка"
    hats_men: "Шапка"
    scarves_women: "Шал"
    scarves_men: "Шал"

  # Полета, които Bazar.bg показва чак СЛЕД избор на рубрика. Без тях
  # формата връща "Изберете вид" и обявата не тръгва.
  #
  # Точните текстове на опциите се виждат с:
  #     shopbot inspect-form --category 339
  #
  # Ако стойност тук не съвпадне с нито една опция, публикуването спира с
  # ясно съобщение — умишлено, вместо да избере нещо наслуки. Грешен избор
  # при доставката значи ти да плащаш куриера.
  form_defaults:
    "Състояние": "Ново"
    "Доставка за сметка на": "Купувача"

  # Цветът е задължителен при чанти, портфейли и подобни рубрики. BestSecret
  # няма отделно поле за него, затова се чете от името и описанието на
  # продукта: дума в текста -> опция в Bazar.bg.
  #
  # Опциите на Bazar.bg са само единайсет (виж `shopbot inspect-form
  # --category 338`), затова златно става "Жълти", а сребърно — "Сиви".
  color_map:
    black: "Черни"
    noir: "Черни"
    white: "Бели"
    ivory: "Бели"
    cream: "Бели"
    red: "Червени"
    burgundy: "Червени"
    wine: "Червени"
    green: "Зелени"
    khaki: "Зелени"
    olive: "Зелени"
    blue: "Сини"
    navy: "Сини"
    denim: "Сини"
    turquoise: "Сини"
    beige: "Бежови"
    sand: "Бежови"
    nude: "Бежови"
    taupe: "Бежови"
    brown: "Кафеви"
    cognac: "Кафеви"
    camel: "Кафеви"
    chocolate: "Кафеви"
    tan: "Кафеви"
    yellow: "Жълти"
    gold: "Жълти"
    golden: "Жълти"
    mustard: "Жълти"
    orange: "Жълти"
    pink: "Розови"
    rose: "Розови"
    fuchsia: "Розови"
    coral: "Розови"
    purple: "Лилави"
    lilac: "Лилави"
    violet: "Лилави"
    grey: "Сиви"
    gray: "Сиви"
    silver: "Сиви"
    anthracite: "Сиви"

  # Когато в текста няма цвят. Черно е най-честият цвят при аксесоарите, но
  # е предположение — ако предпочиташ обявата да се провали, вместо да носи
  # грешен цвят, остави полето празно.
  color_fallback: "Черни"

  # Цветът на Bazar.bg -> прилагателно за заглавието. Върви с думата "цвят",
  # затова е в мъжки род и пасва и на часовник, и на чанта, и на очила.
  color_title_map:
    "Черни": "черен"
    "Бели": "бял"
    "Червени": "червен"
    "Зелени": "зелен"
    "Сини": "син"
    "Бежови": "бежов"
    "Кафеви": "кафяв"
    "Жълти": "жълт"
    "Розови": "розов"
    "Лилави": "лилав"
    "Сиви": "сив"

  # Колко характеристики от продуктовата страница влизат в описанието.
  max_specs: 8

  # "Вид" зависи от категорията в BestSecret, а не от рубриката: мъжките и
  # дамските очила са в една и съща рубрика 339.
  category_attributes:
    sunglasses_women:        { "Изберете вид": "Дамски" }
    sunglasses_men:          { "Изберете вид": "Мъжки" }
    watches_women:           { "Изберете вид": "Дамски" }
    watches_men:             { "Изберете вид": "Мъжки" }
    bags_women:              { "Изберете вид": "Дамски" }
    bags_men:                { "Изберете вид": "Мъжки" }
    small_accessories_women: { "Изберете вид": "Дамски" }
    small_accessories_men:   { "Изберете вид": "Мъжки" }
    hats_women:              { "Изберете вид": "Дамски" }
    hats_men:                { "Изберете вид": "Мъжки" }
    scarves_women:           { "Изберете вид": "Дамски" }
    scarves_men:             { "Изберете вид": "Мъжки" }

  # Телефон за обявата. Оставено празно = ползва се този от профила.
  phone: ""

  # "Чисто нов" отпред казва най-важното още в резултатите от търсенето,
  # а цветът се долепя само ако остава място под title_max_len.
  title_template: "{condition_word} {prefix_lower} {brand} {name}"

  # "Чисто нов" се съгласува с рода на артикула: часовник е мъжки род,
  # чанта — женски, очила — множествено число.
  condition_word:
    sunglasses_women: "Чисто нови"
    sunglasses_men: "Чисто нови"
    watches_women: "Чисто нов"
    watches_men: "Чисто нов"
    bags_women: "Чисто нова"
    bags_men: "Чисто нова"
    small_accessories_women: "Чисто нов"
    small_accessories_men: "Чисто нов"
    hats_women: "Чисто нова"
    hats_men: "Чисто нова"
    scarves_women: "Чисто нов"
    scarves_men: "Чисто нов"
  title_max_len: 70

  description_template: |
    {brand} {name}

    Чисто нов, неупотребяван артикул с фабрични етикети и фирмена опаковка.
    {color_line}{size_line}{material_line}
    {specs_block}
    Каталожна цена: {orig_price}
    Моята цена: {price} — {discount} под каталожната

    ВАЖНО — начин на поръчка
    {delivery_note}

    {extra_note}

  delivery_note: |
    Артикулът се доставя по предварителна заявка.
    Срокът за доставка до офис на куриер е около 10 работни дни.

  extra_note: |
    Изпращам с куриер с опция за преглед и тест преди заплащане.
    Отговарям бързо на съобщения — пиши за допълнителни снимки или въпроси.

bazar:
  # Профилът има включена двуфакторна аутентикация. Bazar.bg връща
  # requires_2fa и автоматичен вход с парола не може да мине — всеки опит
  # само поръчва нов код. Затова сесията се прави ръчно и се пренася,
  # точно както при BestSecret:
  #
  #   на твоя компютър:  shopbot login bazar      (въвеждаш и кода)
  #   после:             scp data/sessions/bazar.json <сървър>:~/Shop-Automation/
  #   на сървъра:        shopbot import-session bazar --file ~/Shop-Automation/bazar.json
  #
  # Ако някога изключиш двуфакторната, върни това на true.
  password_login: false

removal:
  auto_remove: true
  # Как пада обявата. "delete" я трие — изчерпан продукт няма да се върне, а
  # профилът остава чист. Безплатни обяви изтриването НЕ връща. Ботът трие и
  # старите деактивирани обяви, които сам е свалил; пуснатите на ръка не пипа.
  mode: delete
  # Твърд под: под това намаление обявата пада, каквото и да е било в деня
  # на публикуване.
  remove_below_discount_pct: 60
  # Колко процентни пункта може да падне намалението спрямо деня на
  # публикуване. 75% -> 72% е поносимо и обявата остава; 75% -> 60% значи, че
  # офертата, заради която сме я пуснали, вече я няма.
  max_discount_drop_pct: 5
  misses_before_removal: 2

notifications:
  on_publish: true
  on_remove: true
  on_error: true
  on_auth_wall: true
