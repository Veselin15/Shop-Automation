# ============================================================
#  shopbot — конфигурация
#  Стратегия: аксесоари без размерен риск, само силни намаления,
#  предимно известни марки, продажба по предварителна заявка.
#  Файлът се чете при всеки цикъл — не се налага рестарт.
# ============================================================

runtime:
  headless: true
  timezone: Europe/Sofia
  # Ботът работи само в този прозорец. Публикуване в 03:41 сутринта
  # изглежда като бот и на Bazar.bg, и на купувачите.
  active_hours: "09:00-22:30"
  # Секунди между две действия в един и същ сайт (случайно в диапазона).
  min_action_delay_s: 20
  max_action_delay_s: 75

schedule:
  discover_every_min: 240
  recheck_every_min: 90
  recheck_min_age_h: 6

limits:
  # Колко обяви излизат на ден и наведнъж. Публикуването е безплатно, но
  # двайсет обяви в един час изглеждат като бот — затова остават на порции.
  max_publish_per_day: 15
  max_publish_per_run: 5
  max_remove_per_day: 25
  # Плочки за оценка на цикъл. Дванадесет категории по ~456 плочки правят
  # ~5500 — при по-нисък таван последните категории изобщо не се стигат и
  # чантите, портфейлите и шапките така и не се обхождат.
  max_tiles_per_run: 6000
  # Отваряния на продуктова страница — това е скъпото и бавното. Бюджетът се
  # дели поравно между категориите, така че 120 значи по 10 на категория.
  max_product_pages_per_run: 120
  max_active_listings: 60

# ------------------------------------------------------------
#  ОТКЪДЕ ЧЕТЕ
#  Адресите долу са проверени в логнат профил и работят както са.
# ------------------------------------------------------------
source:
  name: bestsecret
  base_url: https://www.bestsecret.com
  sort_query: ""
  max_pages_per_category: 3

  # Адресите са взети от логнат профил и са проверени. Схемата на BestSecret е
  # /category.htm?area=<РАЗДЕЛ>&category=<вътрешно_име>[&gender=MALE].
  #
  # Всеки адрес носи филтъра на самия BestSecret:
  #     filterParam_relativeSavingRanges=70.0-*
  # Той връща само намаленото 70%+, вместо ботът да преглежда 456 плочки на
  # категория, от които стават 3. За 80%+ смени числото на 80.0 — навсякъде
  # или само в отделни категории.
  #
  # Други филтри (марки, цена) се добавят по същия начин: слагаш ги в сайта и
  # копираш адресната лента. Ботът слива query параметрите правилно, така че
  # страницирането не чупи филтъра.
  categories:
    - key: sunglasses_women
      label: "Слънчеви очила (дамски)"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_sonnenbrillen&filterParam_relativeSavingRanges=70.0-*"
    - key: sunglasses_men
      label: "Слънчеви очила (мъжки)"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_sonnenbrillen&gender=MALE&filterParam_relativeSavingRanges=70.0-*"
    - key: watches_women
      label: "Часовници (дамски)"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_uhren&filterParam_relativeSavingRanges=70.0-*"
    - key: watches_men
      label: "Часовници (мъжки)"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_uhren&gender=MALE&filterParam_relativeSavingRanges=70.0-*"
    - key: bags_women
      label: "Дамски чанти"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_taschen&filterParam_relativeSavingRanges=70.0-*"
    - key: bags_men
      label: "Мъжки чанти и crossbody"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_taschen&gender=MALE&filterParam_relativeSavingRanges=70.0-*"
    - key: small_accessories_women
      label: "Портфейли, ключодържатели (дамски)"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_smallaccessories&filterParam_relativeSavingRanges=70.0-*"
    - key: small_accessories_men
      label: "Портфейли, ключодържатели (мъжки)"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_smallaccessories&gender=MALE&filterParam_relativeSavingRanges=70.0-*"
    - key: hats_women
      label: "Шапки (дамски)"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_muetzen&filterParam_relativeSavingRanges=70.0-*"
    - key: hats_men
      label: "Шапки (мъжки)"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_muetzen&gender=MALE&filterParam_relativeSavingRanges=70.0-*"
    - key: scarves_women
      label: "Шалове (дамски)"
      url: "https://www.bestsecret.com/category.htm?area=WOMEN_ACCESSORIES&category=women_accessoires_schalstuecher&filterParam_relativeSavingRanges=70.0-*"
    - key: scarves_men
      label: "Шалове (мъжки)"
      url: "https://www.bestsecret.com/category.htm?area=MEN_ACCESSORIES&category=men_accessoires_schals&gender=MALE&filterParam_relativeSavingRanges=70.0-*"

selection:
  # Твърд праг. Филтърът в BestSecret вече отсява, това е втора защита.
  min_discount_pct: 70
  # Под 30 € печалбата не оправдава заявката; над 200 € купувачът трудно
  # плаща предварително за нещо, което идва след 10 дни.
  min_source_price: 30.0
  max_source_price: 200.0
  # Аксесоарите нямат размер — това ги пуска да минат.
  allow_one_size: true
  # Ако все пак има размери (шапки, колани), поне един да е наличен.
  min_sizes_available: 1
  # Празно = не отрязваме нищо твърдо по марка. Непознатите марки не са
  # забранени, но получават нисък скор и минават само при огромно намаление.
  brands_allow: []
  min_brand_tier: 0.0
  brands_deny:
    - "No Name"
  title_deny_keywords:
    - "gift card"
    - "ваучер"
    - "gutschein"

  popularity:
    # Този скор мери сигнали ОКОЛО продукта — марка, намаление, позиция в
    # листинга. Той не вижда самия артикул, затова вече е само груб филтър:
    # реалната преценка "ще се купи ли" я прави appraisal долу. Ако изключиш
    # appraisal, върни прага на 0.45, иначе тръгва много боклук.
    min_score: 0.30
    unknown_brand_tier: 0.35
    weights:
      brand_tier: 0.40
      discount: 0.25
      bestseller_badge: 0.15
      low_stock: 0.10
      listing_rank: 0.10

    # Съвпадението е частично и без разлика в главни/малки букви:
    # "Armani" хваща и "Emporio Armani", и "Giorgio Armani".
