      "Diesel": 1.0
      # --- и другите, които се продават също толкова добре в БГ ---
      "Ray-Ban": 0.95
      "Versace": 0.90
      "Prada": 0.90
      "Gucci": 0.90
      "Valentino": 0.90
      "Marc Jacobs": 0.90
      "Karl Lagerfeld": 0.90
