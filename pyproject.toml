[project]
name = "shopbot"
version = "0.1.0"
description = "BestSecret -> Bazar.bg listing automation"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pillow>=10.3",
    "tenacity>=8.3",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
shopbot = "shopbot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
